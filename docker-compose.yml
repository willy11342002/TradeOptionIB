# IB Gateway 常駐服務：取代手動開 IB Gateway 軟體、點登入這一步。用
# gnzsnz/ib-gateway-docker(https://github.com/gnzsnz/ib-gateway-docker)
# 這個社群維護的 image，裡面已經包好 IB Gateway + IBC(自動答覆登入/風
# 險揭露等彈窗) + Xvfb + socat，跟 gce/scripts/startup.sh 在 GCE VM 上
# 原生裝的是同一套組合(IBC + Xvfb + socat)——GCE 那邊選原生安裝是因為
# GCP 沒有適合的免費容器服務(見 gce/README.md)，本機沒有這個限制，直
# 接用 docker 最省事。
#
# 帳密/模式設定讀根目錄 .env(見 .env.example)，跟 main.py 共用同一
# 份，不用另外複製一份 docker 專用的 .env。
#
# 對外 port 刻意對齊 IB Gateway 原生預設值(live=4001、paper=4002，見
# app/services/ib_prefs.py 的 DEFAULT_PORT_LIVE/DEFAULT_PORT_PAPER)，
# 這樣 main.py 完全不用改連線設定，跟本機真的裝 Gateway 時一樣直接連
# 127.0.0.1:4001/4002。image 內部實際上是把 Gateway 綁在
# 4003(live)/4004(paper)、用內建的 socat 轉出來——Gateway 的 API
# socket 只綁 127.0.0.1，同一個 network namespace 裡不能自己再監聽一
# 次同個 port，這跟 GCE 原生安裝要另外裝 socat 轉 port 是同一個原因。
#
# app 服務：NiceGUI 本體(main.py)，跟上面的 ib-gateway 一起 `docker
# compose up` 起來。整個專案目錄 mount 進 /app，uvicorn 用 --reload 跑，
# 改 .py 存檔就會自動重新載入。
services:
  ib-gateway:
    container_name: ib-gateway
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_LOGIN_LIVE:-}
      TWS_PASSWORD: ${IB_PASSWORD_LIVE:-}
      TWS_USERID_PAPER: ${IB_LOGIN_PAPER:-}
      TWS_PASSWORD_PAPER: ${IB_PASSWORD_PAPER:-}
      # both = live/paper 各自獨立的 Gateway process 一起常駐，main.py
      # 畫面右上角切模擬/正式環境不用重開 container；只想跑 paper 就把
      # .env 的 IB_TRADING_MODE 改成 paper，IB_LOGIN_LIVE/
      # IB_PASSWORD_LIVE 留空即可。
      TRADING_MODE: ${IB_TRADING_MODE:-both}
      # 全新安裝預設可能是唯讀，不明確設 no 下單會被拒絕——跟
      # gce/scripts/startup.sh 的 config.ini::ReadOnlyApi 是同一個坑。
      # IBC 開機時確實會照這個設定把 Global Configuration 裡的
      # 「Read-Only API」checkbox 自動勾掉(用 docker exec 進容器/接 VNC
      # 都實測驗證過，checkbox 真的是關的)。
      READ_ONLY_API: "no"
      # *** 光有上面這個旗標不夠，Gateway 還有另一道獨立、IBC 無法自動
      # 化的關卡 ***：每次 container 全新開機(全新登入、不是單純
      # restart)，第一個 API client 只要送出任何「需要寫入權限」的請求
      # (連我們自己的 app 連線當下 ib_async 內建就會送的
      # reqOpenOrdersAsync/reqCompletedOrdersAsync 都算)，Gateway 就會
      # 跳出一個叫「API client needs write access action confirmation」
      # 的視窗，要求真人手動確認——這個關卡跟上面的 Read-Only API
      # checkbox 是不是勾著完全無關(checkbox 關了、且已經關了超過一分
      # 鐘再連，一樣照樣跳這個視窗擋下來)，IBC 完全不會幫忙按(這是
      # IBC 官方倉庫 issue #10 記載的已知行為，作者原話"IBC is not
      # intended to be a tool for configuring TWS/Gateway"，2018 年就
      # 明講不會加自動化)。ib_async 這端看到的症狀是
      # `Warning 321: ... Read-Only mode`(誤導性的錯誤訊息，其實是這個
      # 視窗卡住，不是 checkbox 沒關)、`reqOpenOrdersAsync`/
      # `reqCompletedOrdersAsync` 各自等滿 `app/models/ib_client.py::
      # connect_async()` 的 timeout 秒數才放棄。
      #
      # *** 目前唯一確認有效的解法：每次 container 全新開機後，搶在
      # app 第一次連線之前，用 VNC 手動點開 Configure → Settings →
      # API → Settings → Apply → OK 一次(即使 checkbox 已經是關的也要
      # 點，這個動作本身才是清掉那個視窗判定的關鍵，不是勾選狀態)
      # ***：`restart: unless-stopped` 讓 Gateway 大部分時間不會重開，
      # 只有手動 `docker compose up -d --force-recreate`、機器重開機、
      # 或每天 05:00-05:30 UTC 那次排程冷重開(見下面 TWS_COLD_RESTART)
      # 才需要重做這個手動步驟；之後同一次 Gateway session 裡任何次數
      # 的 app 重新整理/斷線重連都不會再卡。VNC 連線密碼見
      # `IB_VNC_PASSWORD`(.env.example 有說明)，noVNC 網頁版連法可以參
      # 考除錯記錄，直接用任何 VNC client 接 127.0.0.1:5900 也可以。
      #
      # TWS_SETTINGS_PATH(下面)只解決「Read-Only API checkbox 本身要不
      # 要重設」這一半，跟上面這道關卡是兩件事，兩個都要處理。
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
      # 無人值守環境保險起見全部自動接受，跟 GCE 那邊
      # AcceptIncomingConnectionAction=accept 理由一致，避免彈窗卡住整
      # 條自動化流程沒人能點。
      TWS_ACCEPT_INCOMING: accept
      EXISTING_SESSION_DETECTED_ACTION: manual
      # 避開交易時間重開(UTC 05:00-05:30，換算美股收盤後凌晨)，跟
      # gce/scripts/startup.sh 的 AutoRestartTime/ColdRestartTime 用同
      # 一組時間——不要為了本機時區另外設 TIME_ZONE，不然算出來的就不
      # 是美股收盤空檔了。
      TWS_COLD_RESTART: "05:00 AM"
      AUTO_RESTART_TIME: "05:30 AM"
      # 2FA 在無人值守流程卡住目前沒有 100% 解法(跟 gce/README.md「已
      # 知的坑」同一個問題)：exit 讓 container 結束、restart:
      # unless-stopped 會重試；不要改成 restart，避免無限重試對帳號觸
      # 發風控。live 帳戶建議先確認 paper 穩定跑過幾天再開。
      TWOFA_TIMEOUT_ACTION: exit
      # 需要用 VNC 接進去手動排查(例如 2FA 卡住、想看畫面在幹嘛)才填，
      # 見 .env.example 說明；留空就不會啟動 VNC server。
      VNC_SERVER_PASSWORD: ${IB_VNC_PASSWORD:-}
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
    volumes:
      # 對應上面 TWS_SETTINGS_PATH——本機這個資料夾放帳密以外的 Gateway
      # 使用者設定(ibg.xml)，跟 .env 一樣不進 git(見 .gitignore)。
      - ./ib_gateway_settings:/home/ibgateway/tws_settings

  app:
    container_name: options-tboard
    build: .
    restart: unless-stopped
    command: ["python", "main.py", "--reload", "--port", "8150"]
    environment:
      # 容器裡的 127.0.0.1 是容器自己，不是本機——main.py 的 IB 連線固定
      # 連 4001/4002(ib_prefs.DEFAULT_PORT_LIVE/PAPER)，剛好就是上面
      # ib-gateway 對本機發佈出來的 port，所以繞回本機去連，不用改
      # main.py。覆蓋 .env 裡的 IB_HOST=127.0.0.1(load_dotenv 預設不會蓋
      # 掉已存在的環境變數)。
      IB_HOST: host.docker.internal
      # *** reload 要正常運作的關鍵 ***：bind mount 在 macOS/Windows 的
      # Docker(含 Rancher Desktop 的 VM)不保證把本機的檔案變動轉成容器裡
      # 的 inotify 事件，只靠事件通知會出現「存檔了卻沒重新載入」。
      # watchfiles(uvicorn --reload 底層)強制改成輪詢，不依賴事件。
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      # Docker Desktop/Rancher Desktop 內建這個名稱；Linux 需要這行才解
      # 析得到(注意：Linux 上 ib-gateway 的 port 綁在 127.0.0.1，容器連
      # 不到，要把上面的 ports 改成 0.0.0.0 綁定)。
      - "host.docker.internal:host-gateway"
    ports:
      - "8150:8150"
    volumes:
      # pref/、logs/、.env 都在專案目錄裡，跟著一起 mount，容器裡讀寫的
      # 就是本機同一份檔案，不用另外處理持久化。
      - .:/app
